[package]
name = "hedgehoog-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Hedgehoog Rust API and PostgreSQL-backed workers"
license = "UNLICENSED"

[lib]
name = "hedgehoog"
path = "src/lib.rs"

[[bin]]
name = "hedgehoog-api"
path = "src/bin/api.rs"

[[bin]]
name = "hedgehoog-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "hedgehoog-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "hedgehoog-scheduler"
path = "src/bin/scheduler.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
cookie = "0.18"
csv = "1"
dotenvy = "0.15"
hostname = "0.4"
jsonwebtoken = "9.3"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "rust_decimal", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
