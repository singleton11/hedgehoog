name: hedgehoog-production

x-runtime-environment: &runtime-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-hedgehoog}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hedgehoog}
  ENVIRONMENT: production
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-43200}
  ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
  JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-500}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
  MARKET_DATA_RETENTION_ENABLED: ${MARKET_DATA_RETENTION_ENABLED:-true}
  MARKET_DATA_RETENTION_BATCH_SIZE: ${MARKET_DATA_RETENTION_BATCH_SIZE:-1000}
  MARKET_DATA_MAX_CALLS_PER_JOB: ${MARKET_DATA_MAX_CALLS_PER_JOB:-40}
  MARKET_DATA_TIMEOUT_SECONDS: ${MARKET_DATA_TIMEOUT_SECONDS:-15}
  YAHOO_REQUEST_INTERVAL_SECONDS: ${YAHOO_REQUEST_INTERVAL_SECONDS:-0.05}

x-backend: &backend
  image: hedgehoog-backend:${RELEASE_SHA:?Set RELEASE_SHA}
  restart: unless-stopped
  environment: *runtime-environment
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  stop_grace_period: 2m
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hedgehoog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hedgehoog}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    logging: *logging

  migrate:
    <<: *backend
    command: [hedgehoog-migrate]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: [hedgehoog-api]
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:8000/health']
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  catalogue-worker:
    <<: *backend
    command: [hedgehoog-worker, --queue, catalogue, --concurrency, '1']

  marketdata-worker:
    <<: *backend
    command: [hedgehoog-worker, --queue, marketdata, --concurrency, '${MARKET_DATA_WORKER_CONCURRENCY:-1}']

  scheduler:
    <<: *backend
    command: [hedgehoog-scheduler]

  web:
    image: hedgehoog-web:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    ports:
      - 80:80
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, 'http://127.0.0.1/api/health']
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *logging

volumes:
  postgresql_data:
