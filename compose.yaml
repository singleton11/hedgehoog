x-rust-environment: &rust-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-hedgehoog}:${POSTGRES_PASSWORD:-hedgehoog-local}@postgres:5432/${POSTGRES_DB:-hedgehoog}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  JWT_SECRET: ${JWT_SECRET:-hedgehoog-local-jwt-secret-change-me-1234567890}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-43200}
  ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-20}
  JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-500}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
  MARKET_DATA_RETENTION_ENABLED: ${MARKET_DATA_RETENTION_ENABLED:-true}
  MARKET_DATA_RETENTION_BATCH_SIZE: ${MARKET_DATA_RETENTION_BATCH_SIZE:-1000}
  MARKET_DATA_MAX_CALLS_PER_JOB: ${MARKET_DATA_MAX_CALLS_PER_JOB:-40}
  MARKET_DATA_TIMEOUT_SECONDS: ${MARKET_DATA_TIMEOUT_SECONDS:-15}
  YAHOO_REQUEST_INTERVAL_SECONDS: ${YAHOO_REQUEST_INTERVAL_SECONDS:-0.05}

x-rust-service: &rust-service
  build:
    context: .
    dockerfile: backend-rust/Dockerfile
  restart: unless-stopped
  environment: *rust-environment
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  stop_grace_period: 2m

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hedgehoog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hedgehoog-local}
      POSTGRES_DB: ${POSTGRES_DB:-hedgehoog}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  migrate:
    <<: *rust-service
    command: ["hedgehoog-migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *rust-service
    command: ["hedgehoog-api"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  catalogue-worker:
    <<: *rust-service
    command: ["hedgehoog-worker", "--queue", "catalogue", "--concurrency", "1"]

  marketdata-worker:
    <<: *rust-service
    command: ["hedgehoog-worker", "--queue", "marketdata", "--concurrency", "${MARKET_DATA_WORKER_CONCURRENCY:-16}"]

  scheduler:
    <<: *rust-service
    command: ["hedgehoog-scheduler"]

volumes:
  postgresql_data:
