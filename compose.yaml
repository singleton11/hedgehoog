services:
  mongodb:
    # MongoDB 8's allocator is incompatible with Docker kernels 6.19–7.0.13.
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-hedgehoog}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-hedgehoog-local}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hedgehoog}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hedgehoog-local}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  celery-worker:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_DATABASE: ${MONGODB_DATABASE:-hedgehoog}
      # Host processes use localhost; containers resolve Compose service names.
      MONGODB_URI: ${WORKER_MONGODB_URI:-mongodb://${MONGO_ROOT_USERNAME:-hedgehoog}:${MONGO_ROOT_PASSWORD:-hedgehoog-local}@mongodb:27017/?authSource=admin}
      CELERY_BROKER_URL: ${WORKER_CELERY_BROKER_URL:-amqp://${RABBITMQ_USER:-hedgehoog}:${RABBITMQ_PASSWORD:-hedgehoog-local}@rabbitmq:5672//}
    command: ["celery", "-A", "celery_app:app", "worker", "--loglevel=info", "--queues=etfs", "--concurrency=1", "--hostname=etf-worker@%h"]
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app:app inspect ping --destination etf-worker@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
  rabbitmq_data:
