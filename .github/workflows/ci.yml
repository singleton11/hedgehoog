name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Rust backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: hedgehoog
          POSTGRES_PASSWORD: hedgehoog
          POSTGRES_DB: hedgehoog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hedgehoog -d hedgehoog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://hedgehoog:hedgehoog@127.0.0.1:5432/hedgehoog
      TEST_DATABASE_URL: postgresql://hedgehoog:hedgehoog@127.0.0.1:5432/hedgehoog
      JWT_SECRET: ci-only-test-secret-with-at-least-32-characters
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - name: Format
        working-directory: backend-rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: backend-rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test against PostgreSQL
        working-directory: backend-rust
        run: cargo test --locked --all-targets --all-features
      - name: Build release image
        run: docker build -f backend-rust/Dockerfile -t hedgehoog-backend:ci .
      - name: Validate Compose
        env:
          RELEASE_SHA: ci
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-only-production-secret-with-at-least-32-characters
          ADMIN_PASSWORD: ci-admin-password
          ALLOWED_ORIGINS: http://localhost
        run: |
          docker compose config >/dev/null
          docker compose -f deploy/compose.yaml config >/dev/null

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  repository-tools:
    name: Repository tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline regression tests
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -W error::ResourceWarning -m unittest discover -s .opencode/skills/paseo-telegram-attention/scripts -p 'test_*.py' -v
          python3 -m unittest discover -s .opencode/skills/planning/tests -v
