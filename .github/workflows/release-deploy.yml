name: Build release bundle
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hedgehoog-release-bundle
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build immutable release bundle
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          npm --prefix frontend ci
          npm --prefix frontend run build
          docker build -f backend-rust/Dockerfile -t hedgehoog-backend:$sha .
          mkdir bundle
          docker save hedgehoog-backend:$sha -o bundle/images.tar
          tar -C frontend/dist -czf bundle/frontend.tar.gz .
          cp deploy/compose.yaml bundle/
          printf '%s\n' "$sha" > bundle/release-sha
          tar -C bundle -cf "hedgehoog-release-$sha.tar" images.tar frontend.tar.gz compose.yaml release-sha
          printf 'RELEASE_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: hedgehoog-release-${{ env.RELEASE_SHA }}
          path: hedgehoog-release-${{ env.RELEASE_SHA }}.tar
          if-no-files-found: error
          retention-days: 14
