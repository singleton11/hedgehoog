[project]
name = "hedgehoog-backend"
version = "0.1.0"
description = "FastAPI backend with MongoDB users and JWT authentication."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.9,<3",
    "pyjwt>=2.10,<3",
    "pymongo>=4.13,<5",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mongomock>=4.3,<5",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
